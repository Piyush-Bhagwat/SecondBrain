<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cogni · Memory</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --border: #262a33;
    --text: #e6e8ec; --muted: #8b93a1; --accent: #3b82f6; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0;
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
  #count { color: var(--muted); font-size: 13px; }
  #search {
    width: 100%; margin-top: 12px; padding: 10px 12px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font: inherit; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .card h3 { margin: 0 0 6px; font-size: 16px; line-height: 1.3; }
  .card p { margin: 0; color: #c3c8d2; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .card p.clamp {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .more { background: none; border: 0; color: var(--accent); padding: 6px 0 0; cursor: pointer; font-size: 13px; }
  .meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px; gap: 10px;
  }
  .del {
    background: transparent; color: var(--danger);
    border: 1px solid var(--danger); border-radius: 6px;
    padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .del:hover { background: var(--danger); color: #fff; }
  .del:disabled { opacity: .5; cursor: default; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Cogni · Memory</h1>
    <span id="count"></span>
  </div>
  <input id="search" type="search" placeholder="Filter cards...">
</header>
<main>
  <div class="wrap" id="list"></div>
</main>

<script>
let all = [];

function fmt(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

function updateCount(shown) {
  document.getElementById("count").textContent =
    shown === all.length ? `${all.length} cards` : `${shown} of ${all.length} cards`;
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";
  const shown = all.filter(c => !q || (c.title + " " + c.content).toLowerCase().includes(q));
  updateCount(shown.length);

  if (!shown.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = all.length ? "No cards match." : "No cards yet. Send something to the bot.";
    list.appendChild(e);
    return;
  }

  for (const c of shown) {
    const el = document.createElement("div");
    el.className = "card";

    const h = document.createElement("h3");
    h.textContent = c.title;

    const p = document.createElement("p");
    p.textContent = c.content;
    p.className = "clamp";

    el.append(h, p);

    if (c.content.length > 220) {
      const more = document.createElement("button");
      more.className = "more";
      more.textContent = "Show more";
      more.onclick = () => {
        const open = p.classList.toggle("clamp");
        more.textContent = open ? "Show more" : "Show less";
      };
      el.appendChild(more);
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    const info = document.createElement("span");
    info.textContent = `${c.source} · ${fmt(c.date)}`;
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "Delete";
    del.onclick = async () => {
      if (!confirm(`Delete "${c.title}"?`)) return;
      del.disabled = true;
      const r = await fetch("/cards/" + c.id, { method: "DELETE" });
      if (r.ok) {
        all = all.filter(x => x.id !== c.id);
        render();
      } else {
        del.disabled = false;
        alert("Delete failed");
      }
    };
    meta.append(info, del);
    el.appendChild(meta);
    list.appendChild(el);
  }
}

async function load() {
  const r = await fetch("/cards?limit=2000");
  const d = await r.json();
  all = d.cards;
  render();
}

document.getElementById("search").addEventListener("input", render);
load();
</script>
</body>
</html>
